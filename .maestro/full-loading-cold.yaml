appId: app.rivl.training
name: Full-screen cold map loading
---
- extendedWaitUntil:
    visible: "This week"
    timeout: 20000
- openLink: "rivl://route-planner?lat=51.5074&lng=-0.1278&sport=ride"
- extendedWaitUntil:
    visible: "Continue while it loads"
    timeout: 15000
- takeScreenshot: loading-full-screen
- extendedWaitUntil:
    notVisible: "Continue while it loads"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: controls-planner
- openLink: rivl://auto-record
- extendedWaitUntil:
    visible: "Start when you move"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Continue while it loads"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: controls-sports
