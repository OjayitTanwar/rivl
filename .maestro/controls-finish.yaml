appId: app.rivl.training
name: Rounded selectors
---
- openLink: rivl://progress
- extendedWaitUntil:
    visible: Overview
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: .impeccable/review/controls-oct14/overview
- tapOn: Analysis
- extendedWaitUntil:
    visible: "Form.*fitness.*fatigue.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: .impeccable/review/controls-oct14/analysis
- openLink: rivl://auto-record
- extendedWaitUntil:
    visible: "Start when you move"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: .impeccable/review/controls-oct14/sports
- openLink: "rivl://route-planner?lat=51.5074&lng=-0.1278&sport=ride"
- extendedWaitUntil:
    visible: "More route options"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: .impeccable/review/controls-oct14/planner-loaded
