appId: app.rivl.training
name: Native sign-up, recording, save, and recovery
env:
  EMAIL: test-ios@example.test
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Your name"
    timeout: 30000
- scrollUntilVisible:
    element: "Your name"
- tapOn:
    id: "auth-name"
- inputText: "Test Athlete"
- scrollUntilVisible:
    element: "Email"
- tapOn:
    id: "auth-email"
- inputText: "${EMAIL}"
- scrollUntilVisible:
    element: "Password"
- tapOn:
    id: "auth-password"
- inputText: "development-only-pass"
- hideKeyboard
- tapOn:
    id: "auth-submit"
- tapOn:
    text: "Not Now"
    optional: true
# iOS 27's password sheet is absent from XCUITest's tree on this simulator.
# The fallback point is the observed Not Now button on iPhone 18 Pro.
- runFlow:
    when:
      notVisible: "This week"
    commands:
      - tapOn:
          point: "31%,64%"
- extendedWaitUntil:
    visible: "This week"
    timeout: 10000
- tapOn: "Record"
- scrollUntilVisible:
    element: "Recording options"
- tapOn: "Recording options"
- scrollUntilVisible:
    element: "Simulate a route"
- tapOn:
    id: "simulate-route"
- tapOn: "Start simulated activity"
- extendedWaitUntil:
    visible: "Pause"
    timeout: 10000
- tapOn: "Pause"
- assertVisible: "Resume"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "This week"
    timeout: 15000
- tapOn: "Record"
- assertVisible: "Resume"
- tapOn: "Resume"
- tapOn: "Finish"
- scrollUntilVisible:
    element: "Activity title"
- tapOn:
    id: "workout-title"
- inputText: "My iPhone run"
- pressKey: Enter
- scrollUntilVisible:
    element: "Save activity"
- tapOn: "Save activity"
- extendedWaitUntil:
    visible: "Activity saved on your device."
    timeout: 15000
- assertVisible: "My iPhone run"
- takeScreenshot: artifacts/ios-recorded-activity

