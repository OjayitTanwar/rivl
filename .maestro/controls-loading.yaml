appId: app.rivl.training
name: Shared controls and full-screen loading
---
- openLink: rivl://progress
- extendedWaitUntil:
    visible: "Overview"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: controls-overview
- tapOn: "Analysis"
- extendedWaitUntil:
    visible: "Form.*fitness.*fatigue.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: controls-analysis
- openLink: rivl://auto-record
- extendedWaitUntil:
    notVisible: "Loading your recording preference.*"
    timeout: 15000
- extendedWaitUntil:
    visible: "Start when you move"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: controls-sports
- openLink: "rivl://route-planner?lat=51.5074&lng=-0.1278&sport=ride"
- extendedWaitUntil:
    visible: "Continue while it loads"
    timeout: 15000
- takeScreenshot: loading-full-screen
- extendedWaitUntil:
    notVisible: "Continue while it loads"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: controls-planner
