appId: app.rivl.training
name: Isolated local QA account
---
- launchApp
- waitForAnimationToEnd
- takeScreenshot: .impeccable/review/auth-oct13
- tapOn: "On this device"
- scrollUntilVisible:
    element:
      id: "auth-name"
- tapOn:
    id: "auth-name"
- inputText: "QA Explorer"
- hideKeyboard
- tapOn:
    id: "auth-email"
- inputText: "explorer-oct13@example.test"
- hideKeyboard
- tapOn:
    id: "auth-password"
- inputText: "local-qa-workout-2026"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "auth-submit"
- tapOn:
    id: "auth-submit"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Explore your world"
    timeout: 15000
- takeScreenshot: .impeccable/review/today-oct13
